<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin | Too Easy</title>
<link rel="icon" href="assets/logo.jpeg">
<link rel="stylesheet" href="assets/style.css">
<style>
  .admin-wrap{ max-width:900px; margin:0 auto; padding:30px 20px 80px; }
  .admin-hide{ display:none !important; }
  .login-box{ max-width:360px; margin:80px auto; padding:30px; border:1px solid var(--line); }
  .login-box input{
    width:100%; padding:12px; margin-bottom:12px; background:var(--black); color:var(--paper);
    border:1px solid var(--line-light); border-radius:2px; font-size:14px;
  }
  .login-box .btn{ width:100%; }
  .login-error{ color:var(--red); font-size:13px; margin-top:8px; }
  .admin-header{ display:flex; justify-content:space-between; align-items:center; margin-bottom:26px; flex-wrap:wrap; gap:10px; }
  .product-row{
    display:flex; gap:14px; align-items:center; padding:14px 0; border-bottom:1px solid var(--line);
  }
  .product-row img{ width:56px; height:66px; object-fit:cover; flex-shrink:0; }
  .product-row .pinfo{ flex:1; min-width:0; }
  .product-row .pinfo .n{ font-weight:700; font-size:14px; }
  .product-row .pinfo .m{ font-size:12px; color:var(--mute); }
  .row-actions{ display:flex; gap:8px; flex-shrink:0; }
  .row-actions button{
    background:none; border:1px solid var(--line-light); color:var(--paper);
    padding:6px 12px; font-size:12px; border-radius:2px; cursor:pointer;
  }
  .row-actions button.danger{ border-color:var(--red); color:var(--red); }
  .form-box{ border:1px solid var(--line); padding:20px; margin-bottom:30px; }
  .form-box h3{ margin-top:0; font-family:'Anton',sans-serif; font-size:18px; }
  .form-box label{ display:block; font-size:12px; color:var(--mute); margin:12px 0 4px; }
  .form-box input, .form-box select{
    width:100%; padding:10px; background:var(--black); color:var(--paper);
    border:1px solid var(--line-light); border-radius:2px; font-size:14px;
  }
  .form-box .btn{ margin-top:16px; }
  .status-msg{ font-size:13px; margin-top:10px; }
  .status-msg.ok{ color:#7fd97f; }
  .status-msg.err{ color:var(--red); }
</style>
</head>
<body>

<header class="site-header">
  <div class="bar">
    <a href="index.html" class="brand-mark">
      <img src="assets/logo.jpeg" alt="Too Easy logo">
      <span>TOO EASY — ADMIN</span>
    </a>
  </div>
</header>

<div id="login-view" class="login-box">
  <h2 class="display" style="font-size:24px; margin-bottom:16px;">ADMIN LOGIN</h2>
  <input type="email" id="login-email" placeholder="Email">
  <input type="password" id="login-password" placeholder="Password">
  <button class="btn btn-solid" id="login-btn">Log in</button>
  <div class="login-error" id="login-error"></div>
</div>

<div id="dashboard-view" class="admin-wrap admin-hide">
  <div class="admin-header">
    <h1 class="display" style="font-size:28px;">DASHBOARD</h1>
    <button class="btn btn-outline" id="logout-btn">Log out</button>
  </div>

  <div class="form-box">
    <h3>Add new product</h3>
    <label>Name</label>
    <input type="text" id="new-name" placeholder="e.g. Regular Tee — Navy / White print">
    <label>Price ($)</label>
    <input type="number" id="new-price" placeholder="15">
    <label>Collection</label>
    <select id="new-collection">
      <option>Regular Tee</option>
      <option>Comic Tees</option>
      <option>Trust Your Dopeness</option>
      <option>Liberian Jue Top</option>
    </select>
    <label>Sizes (comma separated)</label>
    <input type="text" id="new-sizes" value="S,M,L,XL,XXL">
    <label>Product photo</label>
    <input type="file" id="new-image" accept="image/*">
    <button class="btn btn-red" id="add-product-btn">Add product</button>
    <div class="status-msg" id="add-status"></div>
  </div>

  <h3 class="display" style="font-size:20px;">ALL PRODUCTS</h3>
  <div id="product-list"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/supabase-client.js"></script>
<script>
  const loginView = document.getElementById('login-view');
  const dashboardView = document.getElementById('dashboard-view');

  async function checkLoggedIn() {
    const session = await getSession();
    if (session) {
      loginView.classList.add('admin-hide');
      dashboardView.classList.remove('admin-hide');
      loadProductList();
    } else {
      loginView.classList.remove('admin-hide');
      dashboardView.classList.add('admin-hide');
    }
  }

  document.getElementById('login-btn').addEventListener('click', async function () {
    const email = document.getElementById('login-email').value.trim();
    const password = document.getElementById('login-password').value;
    const errorEl = document.getElementById('login-error');
    errorEl.textContent = '';
    const result = await adminLogin(email, password);
    if (!result.ok) { errorEl.textContent = result.message; return; }
    checkLoggedIn();
  });

  document.getElementById('logout-btn').addEventListener('click', async function () {
    await adminLogout();
    checkLoggedIn();
  });

  function productRowHTML(p) {
    return `
      <div class="product-row" data-id="${p.id}">
        <img src="${p.image_url}" alt="${p.name}">
        <div class="pinfo">
          <div class="n">${p.name}</div>
          <div class="m">${p.collection} · $${p.price} · ${p.sizes || 'S–XXL'}</div>
        </div>
        <div class="row-actions">
          <button class="edit-btn">Edit</button>
          <button class="danger delete-btn">Delete</button>
        </div>
      </div>`;
  }

  async function loadProductList() {
    const list = document.getElementById('product-list');
    list.innerHTML = '<p class="mute">Loading…</p>';
    const products = await fetchProducts();
    if (!products.length) { list.innerHTML = '<p class="mute">No products yet.</p>'; return; }
    list.innerHTML = products.map(productRowHTML).join('');
  }

  document.getElementById('add-product-btn').addEventListener('click', async function () {
    const status = document.getElementById('add-status');
    status.textContent = 'Saving…';
    status.className = 'status-msg';

    const name = document.getElementById('new-name').value.trim();
    const price = parseFloat(document.getElementById('new-price').value);
    const collection = document.getElementById('new-collection').value;
    const sizes = document.getElementById('new-sizes').value.trim();
    const fileInput = document.getElementById('new-image');
    const file = fileInput.files[0];

    if (!name || !price || !file) {
      status.textContent = 'Please fill in name, price, and choose a photo.';
      status.className = 'status-msg err';
      return;
    }

    const imageUrl = await uploadProductImage(file);
    if (!imageUrl) {
      status.textContent = 'Image upload failed. Try again.';
      status.className = 'status-msg err';
      return;
    }

    const created = await addProduct({ name: name, price: price, collection: collection, sizes: sizes, image_url: imageUrl });
    if (!created) {
      status.textContent = 'Could not save product.';
      status.className = 'status-msg err';
      return;
    }

    status.textContent = 'Product added!';
    status.className = 'status-msg ok';
    document.getElementById('new-name').value = '';
    document.getElementById('new-price').value = '';
    fileInput.value = '';
    loadProductList();
  });

  document.getElementById('product-list').addEventListener('click', async function (e) {
    const row = e.target.closest('.product-row');
    if (!row) return;
    const id = row.getAttribute('data-id');

    if (e.target.classList.contains('delete-btn')) {
      if (!confirm('Delete this product?')) return;
      await deleteProduct(id);
      loadProductList();
    }

    if (e.target.classList.contains('edit-btn')) {
      const currentName = row.querySelector('.n').textContent;
      const newName = prompt('Product name:', currentName);
      if (newName === null) return;
      const currentPriceText = row.querySelector('.m').textContent;
      const priceMatch = currentPriceText.match(/\$([\d.]+)/);
      const newPrice = prompt('Price ($):', priceMatch ? priceMatch[1] : '');
      if (newPrice === null) return;
      await updateProduct(id, { name: newName, price: parseFloat(newPrice) });
      loadProductList();
    }
  });

  checkLoggedIn();
</script>
</body>
</html>
